name: Auto Scrape Subscribe Links

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 自动触发
  workflow_dispatch:      # 允许在 GitHub 界面上手动点击运行

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: 执行爬虫脚本
        run: python scraper.py

      - name: 提交抓取结果到 GitHub 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.json
          git commit -m "Auto update: scraped subscribe links" || exit 0
          git push
