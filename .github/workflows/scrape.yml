name: Auto Scrape Subscribe Links

on:
  schedule:
    - cron: '*/10 * * * *'  # 每 10 分钟运行一次
  workflow_dispatch:        # 允许手动点击 Run workflow 触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip     

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 执行爬虫
        run: |
          python scraper.py

      - name: 检查生成文件
        run: |
          echo "===== Git 状态 ====="
          git status
          echo "===== 文件列表 ====="
          ls -lh *.md *.txt *.yaml 2>/dev/null || true

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A || true

          if git diff --cached --quiet; then
            echo "🟢 节点无变化，跳过提交"
            exit 0
          fi

          if git log -1 --pretty=%B | grep -q "Auto update"; then
            git commit --amend --no-edit --date=now
          else
            git commit -m "Auto update subscribe links"
          fi
          
          git push --force-with-lease origin HEAD:${{ github.ref_name }}
