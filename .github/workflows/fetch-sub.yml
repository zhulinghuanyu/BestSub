name: Fetch Yfamily Temporary Sub

on:
  schedule:
    # 每 2 小时执行一次（UTC 时间）
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and extract subscription link
        id: extract
        run: |
          # 获取页面内容
          HTML=$(curl -sL --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://yfamilys.com/subscribe")

          # 提取 url-box 里的链接
          LINK=$(echo "$HTML" | grep -oP 'https://yfamilys\.com/subscribe/[A-Za-z0-9_-]+' | head -1)

          if [ -z "$LINK" ]; then
            echo "未能提取到订阅链接"
            exit 1
          fi

          echo "提取到的链接: $LINK"
          echo "link=$LINK" >> $GITHUB_OUTPUT

          # 写入文件
          echo "$LINK" > latest_sub.txt
          echo "更新时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> latest_sub.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet latest_sub.txt; then
            echo "链接未变化，跳过提交"
          else
            git add latest_sub.txt
            git commit -m "更新临时订阅链接 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
