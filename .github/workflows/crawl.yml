name: Crawl yfamilys Subscribe

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时运行一次
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crawl subscribe link
        run: |
          echo "开始抓取页面..."
          
          # 使用更完整的请求头
          HTML=$(curl -sL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
            --max-time 20 \
            https://yfamilys.com/subscribe)
          
          echo "页面长度: ${#HTML}"
          
          # 多种方式提取链接
          LINK=$(echo "$HTML" | grep -oE 'https://yfamilys\.com/subscribe/[A-Za-z0-9]+' | head -1)
          
          # 如果第一种失败，尝试从 url-box 提取
          if [ -z "$LINK" ]; then
            LINK=$(echo "$HTML" | grep -oP '(?<=id="urlBox">)[^<]+' | head -1)
          fi
          
          # 再尝试从 copyLink 函数提取
          if [ -z "$LINK" ]; then
            LINK=$(echo "$HTML" | grep -oP "copyLink\('https://yfamilys\.com/subscribe/[A-Za-z0-9]+'\)" | grep -oE 'https://yfamilys\.com/subscribe/[A-Za-z0-9]+' | head -1)
          fi
          
          if [ -z "$LINK" ]; then
            echo "❌ 未找到订阅链接"
            echo "页面前 500 字符预览："
            echo "$HTML" | head -c 500
            exit 1
          fi
          
          echo "✅ 找到链接: $LINK"
          echo "$LINK" > subscribe.txt
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - $LINK" >> history.log

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add subscribe.txt history.log || true
          
          if git diff --staged --quiet; then
            echo "链接没有变化，跳过提交"
          else
            git commit -m "Update subscribe link $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi
