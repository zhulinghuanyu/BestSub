name: Crawl yfamilys Subscribe

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Crawl with Playwright
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            await page.setExtraHTTPHeaders({
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'
            });
            
            console.log('正在访问页面...');
            await page.goto('https://yfamilys.com/subscribe', { 
              waitUntil: 'networkidle',
              timeout: 30000 
            });
            
            // 等待链接出现
            await page.waitForSelector('#urlBox, .url-box', { timeout: 15000 }).catch(() => {});
            
            const content = await page.content();
            console.log('页面长度:', content.length);
            
            // 提取链接
            let link = await page.evaluate(() => {
              const el = document.querySelector('#urlBox') || document.querySelector('.url-box');
              return el ? el.innerText.trim() : null;
            });
            
            if (!link) {
              // 正则兜底
              const match = content.match(/https:\/\/yfamilys\.com\/subscribe\/[A-Za-z0-9]+/);
              link = match ? match[0] : null;
            }
            
            if (!link) {
              console.log('❌ 未找到订阅链接');
              console.log(content.substring(0, 800));
              process.exit(1);
            }
            
            console.log('✅ 找到链接:', link);
            fs.writeFileSync('subscribe.txt', link + '\n');
            fs.appendFileSync('history.log', new Date().toISOString() + ' - ' + link + '\n');
            
            await browser.close();
          })();
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscribe.txt history.log || true
          if git diff --staged --quiet; then
            echo "链接没有变化，跳过提交"
          else
            git commit -m "Update subscribe link $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi
