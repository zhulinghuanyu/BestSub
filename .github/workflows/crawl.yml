name: Crawl yfamilys Subscribe

on:
  schedule:
    # 每 6 小时执行一次（UTC 时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crawl subscribe link
        run: |
          # 抓取页面内容
          HTML=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://yfamilys.com/subscribe)
          
          # 用正则提取订阅链接（根据实际页面调整）
          LINK=$(echo "$HTML" | grep -oP 'https://yfamilys\.com/subscribe/[A-Za-z0-9]+' | head -1)
          
          if [ -z "$LINK" ]; then
            echo "❌ 未找到订阅链接"
            exit 1
          fi
          
          echo "✅ 找到链接: $LINK"
          echo "$LINK" > subscribe.txt
          
          # 可选：同时保存时间戳
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - $LINK" >> history.log

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add subscribe.txt history.log || true
          
          # 只有内容变化才提交
          if git diff --staged --quiet; then
            echo "链接没有变化，跳过提交"
          else
            git commit -m "Update subscribe link $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi
